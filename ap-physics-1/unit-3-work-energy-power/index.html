<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AP Physics 1 — Unit 2 Force and Translational Dynamics</title>

  <style>
    :root {
      --purple: #462b7a;
      --yellow: #facf22;
      --white: #fefefe;
      --bg: #f5f3f9;
      --text: #241b33;
      --muted: #645d70;
      --line: #d9d1e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--purple);
      color: white;
      border-bottom: 6px solid var(--yellow);
    }

    .wrap {
      width: min(1180px, calc(100% - 30px));
      margin: auto;
    }

    .head {
      padding: 24px 0;
    }

    .head h1 {
      margin: 0;
    }

    .head p {
      margin: 6px 0 0;
      color: #eee8f8;
    }

    main {
      padding: 34px 0 60px;
    }

    .crumbs {
      margin-bottom: 18px;
    }

    .crumbs a {
      color: var(--purple);
      font-weight: 700;
    }

    /* Simulation card grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    /* Individual simulation card */
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 180px;
      box-shadow: 0 8px 22px rgba(70, 43, 122, 0.09);
    }

    .card h3 {
      margin: 0;
      color: var(--purple);
    }

    .card p {
      color: var(--muted);
      flex: 1;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      text-align: center;
      background: var(--yellow);
      color: var(--purple);
      font-weight: 900;
      text-decoration: none;
      padding: 11px 14px;
      border-radius: 9px;
    }

    .btn:hover {
      filter: brightness(0.97);
    }

    footer {
      background: #321d5e;
      color: white;
      padding: 20px 0;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ==================== PAGE HEADER ==================== -->
  <header>
    <div class="wrap head">
      <h1>AP Physics 1 — Unit 2: Force and Translational Dynamics</h1>
      <p>Lessons With Londot Physics Simulations</p>
    </div>
  </header>


  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="wrap">

    <div class="crumbs">
      <a href="../">← AP Physics 1</a>
    </div>


    <!-- =====================================================
         SIMULATION CARDS
         Add new simulations INSIDE this grid.
         Copy one complete .card block and change:
           1. Simulation title
           2. Description
           3. HTML filename in href=""
         ===================================================== -->
    <div class="grid">
 <!-- =========================================================
           SIMULATION CARD: Work-Energy Lab
           To add another simulation, copy this entire card block.
           ========================================================= -->
      <div class="card">
        <h3>Work-Energy Investigation</h3>

        <p>
          Investigate the Work–Energy Theorem using a virtual modified Atwood machine.
        </p>

        <a class="btn" href="work-energy-lab/">
          Launch Simulation
        </a>
      </div>

         <!-- =========================================================
           ADD NEW SIMULATION CARDS ABOVE THIS LINE
           ========================================================= -->

    </div>

  </main>


  <!-- ==================== PAGE FOOTER ==================== -->
  <footer>
    <div class="wrap">
      Interactive investigations for physics students.
    </div>
  </footer>

</body>

</html>
